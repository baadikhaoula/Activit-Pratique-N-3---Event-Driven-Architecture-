spring.application.name=kafka-spring-cloud-stream
# Port de l'application (8087 car 8080 est pris par Jenkins)
server.port=8087

# ==========================================
# Configuration Kafka (Connexion depuis Windows)
# ==========================================
# On utilise localhost:29092 car c'est le port exposé par Docker pour votre PC
spring.kafka.bootstrap-servers=localhost:29092

# Sérialiseur pour la clé (String)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# IMPORTANT : Sérialiseur pour la valeur (ByteArray)
# Cela corrige l'erreur "ClassCastException: class [B cannot be cast to class java.lang.String"
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# ==========================================
# Configuration Spring Cloud Stream
# ==========================================
spring.cloud.stream.kafka.binder.brokers=localhost:29092