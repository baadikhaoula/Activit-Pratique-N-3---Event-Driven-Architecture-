spring.application.name=kafka-spring-cloud-stream
# ==========================================
# Configuration du serveur
# ==========================================
server.port=8087

# ==========================================
# Configuration Kafka (connexion depuis Windows)
# ==========================================
spring.kafka.bootstrap-servers=localhost:29092

# ==========================================
# Configuration Spring Cloud Stream - Producer
# ==========================================
# IMPORTANT : Utiliser ByteArraySerializer car Spring Cloud Stream sérialise en JSON (byte[])
spring.cloud.stream.kafka.binder.configuration.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.cloud.stream.kafka.binder.configuration.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# ==========================================
# Configuration Spring Cloud Stream - Consumer
# ==========================================
spring.cloud.stream.kafka.binder.configuration.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.cloud.stream.kafka.binder.configuration.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ==========================================
# Bindings (liaisons avec les topics Kafka)
# ==========================================
# Lier le consumer "pageEventConsumer" au topic T2
spring.cloud.stream.bindings.pageEventConsumer-in-0.destination=T2
spring.cloud.stream.bindings.pageEventConsumer-in-0.group=my-consumer-group

# ==========================================
# Définition de la fonction à utiliser
# ==========================================
spring.cloud.function.definition=pageEventConsumer