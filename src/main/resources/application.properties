# ==========================================
# Configuration du serveur
# ==========================================
spring.application.name=kafka-spring-cloud-stream
server.port=8087

# ==========================================
# Configuration Kafka
# ==========================================
spring.kafka.bootstrap-servers=localhost:29092
spring.cloud.stream.kafka.binder.brokers=localhost:29092

# ==========================================
# Configuration des sérialiseurs (IMPORTANT)
# ==========================================
# ByteArraySerializer pour éviter le ClassCastException
spring.cloud.stream.kafka.binder.configuration.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.cloud.stream.kafka.binder.configuration.key.serializer=org.apache.kafka.common.serialization.StringSerializer

spring.cloud.stream.kafka.binder.configuration.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.cloud.stream.kafka.binder.configuration.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ==========================================
# Configuration Kafka Streams
# ==========================================
# Intervalle de commit des offsets toutes les 1000ms (1 seconde)
spring.cloud.stream.kafka.streams.binder.configuration.commit.interval.ms=1000

# ==========================================
# Définition des fonctions
# ==========================================
spring.cloud.function.definition=pageEventConsumer;pageEventSupplier;kStreamFunction

# ==========================================
# Bindings - Consumer (pageEventConsumer)
# ==========================================
# Écoute le topic T2
spring.cloud.stream.bindings.pageEventConsumer-in-0.destination=T2
spring.cloud.stream.bindings.pageEventConsumer-in-0.group=consumer-group

# ==========================================
# Bindings - Supplier (pageEventSupplier)
# ==========================================
# Envoie vers le topic T3
spring.cloud.stream.bindings.pageEventSupplier-out-0.destination=T3
# Poller configuré pour envoyer toutes les 200ms
spring.cloud.stream.bindings.pageEventSupplier-out-0.producer.poller.fixed-delay=200

# ==========================================
# Bindings - Kafka Streams (kStreamFunction)
# ==========================================
# Lit depuis le topic T3
spring.cloud.stream.bindings.kStreamFunction-in-0.destination=T3
# Écrit vers le topic T4
spring.cloud.stream.bindings.kStreamFunction-out-0.destination=T4